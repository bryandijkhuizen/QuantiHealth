name: Quanti CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  quantivita-server:
    name: Quantivita Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/quantivita-mcp/server/package-lock.json
      - name: Install dependencies
        working-directory: services/quantivita-mcp/server
        run: npm ci
      - name: Run tests
        working-directory: services/quantivita-mcp/server
        run: npm test

  app-matrix:
    name: Validate App Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release app manifest
        run: |
          jq -e '.apps | length > 0 and all(.[]; .id and .path and .platform and .scheme and .tagPrefix and .currentVersion and .bundleIdentifier and .teamId)' release/apps.json
          jq -e '.services | length > 0 and all(.[]; .id and .path and .tagPrefix and .versionFile and .testCommand)' release/services.json
