name: Deploy Quantivita MCP

on:
  push:
    tags:
      - "quantivita-mcp-v*.*.*"
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test Quantivita MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/quantivita-mcp/server/package-lock.json

      - name: Install dependencies
        working-directory: services/quantivita-mcp/server
        run: npm ci

      - name: Run MCP tests
        working-directory: services/quantivita-mcp/server
        run: npm test

  deploy:
    needs: test-and-deploy
    runs-on: quantivita-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Progressa API and Quantivita MCP
        run: bash scripts/release_health_services.sh
