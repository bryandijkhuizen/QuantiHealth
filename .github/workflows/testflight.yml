name: Deploy Quanti Apps to TestFlight

on:
  push:
    tags:
      - "quantivita-native-ios-v*.*.*"
      - "progressa-native-ios-v*.*.*"
  workflow_dispatch:
    inputs:
      app:
        description: "App id from release/apps.json, or all"
        default: "all"
        required: true
      bootstrap_signing:
        description: "Allow fastlane match to create signing assets"
        default: "false"
        required: true
        type: boolean

jobs:
  matrix:
    name: Build app matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          requested="${{ github.event.inputs.app || 'all' }}"
          ref_name="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            apps="$(jq -c --arg tag "${ref_name}" '[.apps[] | select(.tagPrefix as $prefix | $tag | startswith($prefix))]' release/apps.json)"
          elif [[ "${requested}" == "all" ]]; then
            apps="$(jq -c '.apps' release/apps.json)"
          else
            apps="$(jq -c --arg app "${requested}" '[.apps[] | select(.id == $app)]' release/apps.json)"
          fi
          if [[ "${apps}" == "[]" ]]; then
            echo "Unknown app: ${requested}" >&2
            exit 1
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  testflight:
    name: TestFlight ${{ matrix.app.name }}
    needs: matrix
    runs-on: macos-26
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJson(needs.matrix.outputs.apps) }}

    env:
      APP_PATH: ${{ matrix.app.path }}
      APP_PLATFORM: ${{ matrix.app.platform }}
      IOS_SCHEME: ${{ matrix.app.scheme }}
      IOS_TEAM_ID: ${{ matrix.app.teamId }}
      IOS_APP_IDENTIFIER: ${{ matrix.app.bundleIdentifier }}

      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      BOOTSTRAP_SIGNING: ${{ github.event.inputs.bootstrap_signing || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test Quantivita before distribution
        if: matrix.app.id == 'quantivita-native'
        run: bash scripts/test_quantivita_native.sh

      - name: Check required secrets
        shell: bash
        run: |
          missing=()
          for key in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            MATCH_PASSWORD \
            MATCH_GIT_URL \
            MATCH_GIT_BASIC_AUTHORIZATION
          do
            if [[ -z "${!key:-}" ]]; then
              missing+=("${key}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required TestFlight secrets/env values:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Configure signing mode
        shell: bash
        run: |
          if [[ "${BOOTSTRAP_SIGNING}" == "true" ]]; then
            echo "QUANTI_MATCH_BOOTSTRAP=true" >> "$GITHUB_ENV"
            echo "fastlane match bootstrap enabled"
          else
            echo "QUANTI_MATCH_BOOTSTRAP=false" >> "$GITHUB_ENV"
            echo "fastlane match readonly mode enabled"
          fi

      - name: Install Ruby dependencies
        run: bundle install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
